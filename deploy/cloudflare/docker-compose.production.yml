# ==============================================================================
# Docker Compose — Automotive OS Production Origin Backend Stack
# Origin Host: UAE VPS / me-central-1 Sovereign Compute Node
# Ingress: Cloudflare Tunnel (cloudflared) sidecar only. Zero public open ports.
# ==============================================================================

version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # NestJS Modular Monolith API (apps/api)
  # ----------------------------------------------------------------------------
  api:
    image: ${IMAGE_REGISTRY:-ghcr.io/syedhasnathaidershah}/api:${APP_VERSION:-production-latest}
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=postgresql://${DB_USER:-automotive_user}:${DB_PASSWORD:?DB_PASSWORD must be set}@postgres:5432/${DB_NAME:-automotive_os_production}?schema=public
      - DIRECT_URL=postgresql://${DB_USER:-automotive_user}:${DB_PASSWORD:?DB_PASSWORD must be set}@postgres:5432/${DB_NAME:-automotive_os_production}?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set}
      - CORS_ORIGINS=https://marketplace.automotive-os.ae,https://dealer.automotive-os.ae,https://admin.automotive-os.ae
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:?R2_ACCESS_KEY_ID must be set}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:?R2_SECRET_ACCESS_KEY must be set}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME:-automotive-os-media-production}
      - R2_KYB_BUCKET_NAME=${R2_KYB_BUCKET_NAME:-automotive-os-kyb-production}
      - R2_ENDPOINT=${R2_ENDPOINT:-https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com}
      - R2_PUBLIC_URL=https://media.automotive-os.ae
      - RATE_LIMIT_TTL=60
      - RATE_LIMIT_MAX=100
      # Sovereign UAE compliance & integration guards: Live financial/gov calls approval-gated
      - ENABLE_LIVE_PAYMENTS=false
      - ENABLE_RTA_LIVE_CERTIFICATION=false
      - ENABLE_UAE_PASS_PRODUCTION=false
      - STAGING_FIXTURE_ISOLATION=false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s

  # ----------------------------------------------------------------------------
  # PostgreSQL 16 Database with RLS
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DB_USER:-automotive_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set}
      - POSTGRES_DB=${DB_NAME:-automotive_os_production}
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --lc-collate=C --lc-ctype=C
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-automotive_user} -d ${DB_NAME:-automotive_os_production}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Redis 7 (BullMQ Job Queue & Distributed Locks)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "1024mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    networks:
      - internal-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ----------------------------------------------------------------------------
  # Cloudflare Tunnel Sidecar (Zero Public Ports on Host)
  # ----------------------------------------------------------------------------
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN must be set}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal-net

networks:
  internal-net:
    driver: bridge

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
