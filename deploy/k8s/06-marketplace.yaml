apiVersion: v1
kind: Service
metadata:
  name: marketplace-service
  namespace: automotive-os-staging
spec:
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app: marketplace
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: marketplace
  namespace: automotive-os-staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: marketplace
  template:
    metadata:
      labels:
        app: marketplace
    spec:
      containers:
        - name: marketplace
          image: automotive-os/marketplace:staging-1.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: automotive-os-staging-config
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 15
