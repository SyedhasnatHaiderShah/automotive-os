apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: automotive-os-staging
spec:
  ports:
    - port: 4000
      targetPort: 4000
      name: http
  selector:
    app: api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: automotive-os-staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: automotive-os/api:staging-1.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
              name: http
          envFrom:
            - configMapRef:
                name: automotive-os-staging-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: automotive-os-staging-secrets
                  key: DATABASE_URL
            - name: DIRECT_URL
              valueFrom:
                secretKeyRef:
                  name: automotive-os-staging-secrets
                  key: DIRECT_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: automotive-os-staging-secrets
                  key: REDIS_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: automotive-os-staging-secrets
                  key: JWT_SECRET
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1.5Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 20
            periodSeconds: 15
