apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: automotive-os-staging-ingress
  namespace: automotive-os-staging
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-staging"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
spec:
  tls:
    - hosts:
        - marketplace.staging.automotive-os.ae
        - dealer.staging.automotive-os.ae
        - admin.staging.automotive-os.ae
        - api.staging.automotive-os.ae
      secretName: automotive-os-staging-tls
  rules:
    - host: marketplace.staging.automotive-os.ae
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: marketplace-service
                port:
                  number: 3000
    - host: dealer.staging.automotive-os.ae
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dealer-service
                port:
                  number: 3001
    - host: admin.staging.automotive-os.ae
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: admin-service
                port:
                  number: 3002
    - host: api.staging.automotive-os.ae
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-service
                port:
                  number: 4000
