# ==============================================================================
# Cloudflare Workers Staging Manifest — Dealer Cockpit (DMS)
# Application: apps/dealer
# Target: https://dealer-staging.syedhasnat.com
# ==============================================================================

name = "automotive-os-dealer-staging"
main = ".open-next/worker.js"
compatibility_date = "2026-10-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[vars]
NEXT_PRIVATE_MINIMAL_MODE = "1"
NEXT_PUBLIC_APP_ENV = "staging"
NEXT_PUBLIC_API_URL = "https://api-staging.syedhasnat.com"
NEXT_PUBLIC_STORAGE_URL = "https://media-staging.syedhasnat.com"
NEXT_PUBLIC_DEALER_URL = "https://dealer-staging.syedhasnat.com"
NEXT_PUBLIC_DEFAULT_LOCALE = "en"
NEXT_PUBLIC_SUPPORTED_LOCALES = "en,ar"
NEXT_PUBLIC_DEFAULT_CURRENCY = "AED"

[observability]
enabled = true
