name: Monorepo CI - Quality & Security Gates

on:
  pull_request:
    branches: [main, master, develop]
  push:
    branches: [main, develop, "feature/**", "fix/**", "release/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Code Quality & Static Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.9

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @automotive-os/database run prisma:generate

      - name: Lint Verification
        run: pnpm run lint

      - name: Static Typecheck Verification
        run: pnpm run typecheck

  security-and-rls-tests:
    name: Security, Tenancy & RLS Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: automotive_os
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.9

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @automotive-os/database run prisma:generate

      - name: Deploy Migrations, Seed Fixtures & Apply RLS Policies
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/automotive_os?schema=public
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/automotive_os?schema=public
        run: |
          pnpm --filter @automotive-os/database run prisma:deploy
          pnpm --filter @automotive-os/database run seed
          pnpm --filter @automotive-os/database exec tsx scripts/apply-tenant-policies.ts

      - name: Execute Full Test Suites (API, RLS & Negative Security)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/automotive_os?schema=public
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/automotive_os?schema=public
          NODE_ENV: test
          BACKUP_PROVIDER_ADAPTER: mock
          JWT_SECRET: dev-jwt-secret-replace-in-production-min-32-chars-long
          CORS_ORIGINS: "http://localhost:3000,http://localhost:3001,http://localhost:3002"
          R2_ACCESS_KEY_ID: test-r2-key
          R2_SECRET_ACCESS_KEY: test-r2-secret-1234567890
          R2_ENDPOINT: https://test-account.r2.cloudflarestorage.com
          R2_BUCKET_NAME: automotive-os-media-staging
        run: pnpm run test

  production-build:
    name: Monorepo Production Build Verification
    runs-on: ubuntu-latest
    needs: [quality-gate]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.9

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @automotive-os/database run prisma:generate

      - name: Production Build (Next.js Apps & NestJS API)
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1
        run: pnpm run build

  manifest-validate:
    name: Validate Staging & K8s Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: "5.3.0"

      - name: Validate K8s Manifests via Kustomize
        run: |
          kustomize build deploy/k8s > /dev/null
          echo "Kubernetes staging manifests validated successfully."
